# API plus a Qdrant server. First run:
#   docker compose run --rm api cbrag ingest
#   docker compose run --rm api cbrag index
#   docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    restart: unless-stopped

  api:
    build: .
    depends_on: [qdrant]
    env_file: [.env]
    environment:
      CBRAG_QDRANT_URL: http://qdrant:6333
      CBRAG_DATA_DIR: /data
    ports: ["8000:8000"]
    volumes:
      - data:/data
      - models:/home/app/.cache
    restart: unless-stopped

volumes:
  qdrant:
  data:
  models:
