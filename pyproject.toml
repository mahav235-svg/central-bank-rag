[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "central-bank-rag"
version = "0.1.0"
description = "Question answering over Federal Reserve and Reserve Bank of India policy documents, with hybrid retrieval, a LangGraph agent and an evaluation harness"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mahavir Bhattacharya" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "qdrant-client>=1.19,<2",
    "fastembed>=0.8,<0.9",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "pymupdf>=1.26,<2",
    "duckdb>=1.1,<2",
    "pyarrow>=17",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
openai = ["openai>=2.0,<4"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
mcp = ["mcp>=2.0,<3"]
all = ["central-bank-rag[anthropic,openai,api,mcp]"]
dev = [
    "central-bank-rag[all]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "pre-commit>=3.7",
]

[project.scripts]
cbrag = "policyrag.cli:app"

[project.urls]
Repository = "https://github.com/mahav235-svg/central-bank-rag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policyrag = ["py.typed", "catalog.sql"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["policyrag"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "fitz.*", "pymupdf.*", "qdrant_client.*", "duckdb.*", "pyarrow.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: needs internet access (deselect with -m 'not network')",
    "models: downloads embedding models on first run",
]
